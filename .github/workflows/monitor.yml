name: Monitor Apple stock
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['public/stock.json', 'public/history.json']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: stock-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run collect
      - name: Save snapshot and changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/stock.json public/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Apple inventory snapshot'
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
