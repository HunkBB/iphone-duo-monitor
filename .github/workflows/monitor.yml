name: Deploy inventory website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['public/stock.json', 'public/history.json']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: stock-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
